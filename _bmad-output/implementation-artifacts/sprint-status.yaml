# DEFINICIONES DE ESTADO:
# ======================
# Estado de Épica:
#   - backlog: Épica aún no iniciada
#   - in-progress: Épica en trabajo activo
#   - done: Todas las historias de la épica completadas
#   - frozen: Congelada: diseñada, fuera del MVP, retomable sin rehacer
#
# Transiciones de Épica:
#   - backlog → in-progress: Automáticamente al crear la primera historia (vía create-story)
#   - in-progress → done: Manualmente cuando todas las historias llegan a 'done'
#
# Estado de Historia:
#   - backlog: La historia solo existe en el archivo de épicas
#   - ready-for-dev: Archivo de historia creado en la carpeta de historias
#   - in-progress: Desarrollador implementando activamente
#   - review: Lista para code review (vía workflow code-review del Dev)
#   - done: Historia completada
#   - frozen: Congelada: diseñada, fuera del MVP, retomable sin rehacer (create-story la salta)
#
# Estado de Retrospectiva:
#   - optional: Se puede realizar pero no es obligatoria
#   - done: Retrospectiva completada
#
# Estado de Action Items:
#   - open: Comprometido en una retrospectiva, aún no atendido
#   - in-progress: En trabajo activo
#   - done: Completado
#
# NOTAS DEL FLUJO:
# ================
# - La épica pasa a 'in-progress' automáticamente al crear su primera historia
# - Las historias pueden trabajarse en paralelo si la capacidad lo permite
# - El desarrollador normalmente crea la siguiente historia tras terminar la anterior, para incorporar aprendizajes
# - El Dev mueve la historia a 'review' y luego ejecuta code-review (contexto fresco, idealmente otro LLM)
# - La retrospectiva agrega sus action items a action_items; sprint-status muestra los abiertos
#
# CAMBIO DE RUMBO 2026-11-11 (sprint-change-proposal-2026-11-11.md):
# MVP = registrar gastos con IA (foto, voz, a mano) + resumen del mes.
# Orden del MVP: 1-10 → 2-1 → 2-2 → 1-9 → 4-1 → 4-2 → 4-3 → 2-3 → 2-4 → 4-4 → 7-1

